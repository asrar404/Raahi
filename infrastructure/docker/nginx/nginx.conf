worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format raahi '$remote_addr - $request_id "$request" '
                     '$status $body_bytes_sent $upstream_response_time';
    access_log /var/log/nginx/access.log raahi;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  65;
    client_max_body_size 2m;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 512;

    # ── Upstreams ───────────────────────────────────────────
    upstream raahi_backend {
        server backend:8000;
        keepalive 32;
    }

    upstream raahi_ai {
        server ai_engine:8001;
        keepalive 16;
    }

    # ── WebSocket upgrade mapping ───────────────────────────
    # Connection must be "upgrade" only when the client asked for it; hardcoding
    # it breaks ordinary keep-alive HTTP requests through the same server block.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limit the SOS path generously but not infinitely. This is a safety
    # endpoint, so the limit exists to stop abuse, not to throttle real use.
    limit_req_zone $binary_remote_addr zone=sos:10m rate=30r/m;

    server {
        listen 80;
        server_name _;

        # ── WebSocket: live trip telemetry ──────────────────
        location /ws/ {
            proxy_pass http://raahi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # A trip lasts hours and telemetry arrives every ~15s. The default
            # 60s read timeout would sever the socket mid-journey, which is
            # exactly when the safety pipeline needs it alive.
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }

        # ── AI engine ───────────────────────────────────────
        location /ai/ {
            # Trailing slash on proxy_pass strips the /ai/ prefix, so
            # /ai/plan reaches the engine as /plan.
            proxy_pass http://raahi_ai/;
            proxy_http_version 1.1;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header Connection       "";

            # Planning involves an LLM round trip; 60s is not enough.
            proxy_read_timeout    120s;
            proxy_connect_timeout 10s;
        }

        # ── SOS: rate limited ───────────────────────────────
        location /api/v1/safety/sos {
            limit_req zone=sos burst=10 nodelay;

            proxy_pass http://raahi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection      "";
            proxy_read_timeout 30s;
        }

        # ── Everything else -> gateway ──────────────────────
        location / {
            proxy_pass http://raahi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection       "";

            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # Internal service endpoints must not be reachable from outside.
        # The watcher and AI engine reach these over the Docker network.
        location /api/v1/safety/notify-contacts { deny all; }
        location /api/v1/safety/score-points    { deny all; }

        location = /health {
            proxy_pass http://raahi_backend/health;
            access_log off;
        }
    }
}
